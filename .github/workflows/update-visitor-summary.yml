name: Refresh portfolio visitor summary

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-visitor-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Fetch all-time GoatCounter visitor statistics
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GOATCOUNTER_API_TOKEN:-}" ]; then
            echo "::error::Add GOATCOUNTER_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p assets/analytics
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GOATCOUNTER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://scienaut.goatcounter.com/api/v0/stats/total?start=2005-01-01T00%3A00%3A00Z" \
            -o /tmp/total.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GOATCOUNTER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://scienaut.goatcounter.com/api/v0/stats/locations?start=2005-01-01T00%3A00%3A00Z&limit=100" \
            -o /tmp/locations.json
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          with open('/tmp/total.json', encoding='utf-8') as f:
              total_data = json.load(f)
          with open('/tmp/locations.json', encoding='utf-8') as f:
              location_data = json.load(f)
          total = total_data.get('total')
          if total is None:
              raise SystemExit('GoatCounter total response did not include total')
          raw = location_data.get('stats', [])
          countries = []
          for row in raw:
              code = str(row.get('id', '')).upper()
              name = str(row.get('name', '')).strip()
              count = row.get('count', 0)
              if re.fullmatch(r'[A-Z]{2}', code) and name and isinstance(count, (int, float)):
                  countries.append({'code': code, 'name': name, 'count': int(count)})
          countries.sort(key=lambda x: x['count'], reverse=True)
          output = {
              'source': 'GoatCounter',
              'metric': 'all-time pageview visitors',
              'total': int(total),
              'countries': countries[:10],
              'updated': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          }
          os.makedirs('assets/analytics', exist_ok=True)
          with open('assets/analytics/visitors.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print('Updated total:', output['total'], 'country entries:', len(output['countries']))
          PY

      - name: Commit visitor summary
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/analytics/visitors.json; then
            echo "No visitor-summary changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics/visitors.json
          git commit -m "Update portfolio visitor summary"
          git push
