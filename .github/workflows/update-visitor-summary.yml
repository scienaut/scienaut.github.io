name: Refresh portfolio visitor country flags

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-country-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Fetch all-time country statistics from GoatCounter
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GOATCOUNTER_API_TOKEN:-}" ]; then
            echo "::error::Add GOATCOUNTER_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p assets/analytics
          curl --fail --silent --show-error -H "Authorization: Bearer ${GOATCOUNTER_API_TOKEN}" -H "Content-Type: application/json" "https://scienaut.goatcounter.com/api/v0/stats/locations?start=2005-01-01T00%3A00%3A00Z&limit=100" -o /tmp/locations.json
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          with open('/tmp/locations.json', encoding='utf-8') as file:
              location_data = json.load(file)

          countries = []
          for row in location_data.get('stats', []):
              code = str(row.get('id', '')).upper()
              name = str(row.get('name', '')).strip()
              count = row.get('count', 0)
              if re.fullmatch(r'[A-Z]{2}', code) and name and isinstance(count, (int, float)):
                  countries.append({'code': code, 'name': name, 'count': int(count)})

          countries.sort(key=lambda item: item['count'], reverse=True)
          output = {
              'source': 'GoatCounter',
              'period': 'All time (from 2005-01-01)',
              'countries': countries[:7],
              'updated': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          }

          os.makedirs('assets/analytics', exist_ok=True)
          with open('assets/analytics/countries.json', 'w', encoding='utf-8') as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print('Country entries written:', len(output['countries']))
          PY

      - name: Commit refreshed country summary
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/analytics/countries.json; then
            echo "No country-summary changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics/countries.json
          git commit -m "Update portfolio visitor country summary"
          git push
