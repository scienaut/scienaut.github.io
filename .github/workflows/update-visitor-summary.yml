name: Refresh portfolio visitor country flags

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-country-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Fetch all-time country statistics from GoatCounter
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GOATCOUNTER_API_TOKEN:-}" ]; then
            echo "::error::Add GOATCOUNTER_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p assets/analytics
          API_BASE="https://scienaut.goatcounter.com/api/v0"
          AUTH_HEADER="Authorization: Bearer ${GOATCOUNTER_API_TOKEN}"

          # Verify that this host recognizes the token before requesting statistics.
          ME_STATUS=$(curl --silent --show-error -H "$AUTH_HEADER" -H "Content-Type: application/json" -o /tmp/me.json -w "%{http_code}" "$API_BASE/me")
          if [ "$ME_STATUS" -lt 200 ] || [ "$ME_STATUS" -ge 300 ]; then
            echo "::error::GoatCounter /api/v0/me returned HTTP $ME_STATUS. Response:"
            cat /tmp/me.json
            exit 1
          fi

          STATS_STATUS=$(curl --silent --show-error -H "$AUTH_HEADER" -H "Content-Type: application/json" -o /tmp/locations.json -w "%{http_code}" "$API_BASE/stats/locations?start=2005-01-01T00%3A00%3A00Z&limit=100")
          if [ "$STATS_STATUS" -lt 200 ] || [ "$STATS_STATUS" -ge 300 ]; then
            echo "::error::GoatCounter /api/v0/stats/locations returned HTTP $STATS_STATUS. Response:"
            cat /tmp/locations.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          with open('/tmp/locations.json', encoding='utf-8') as file:
              location_data = json.load(file)

          if not isinstance(location_data, dict) or not isinstance(location_data.get('stats'), list):
              raise SystemExit('Unexpected GoatCounter response: expected an object containing a stats array')

          countries = []
          for row in location_data['stats']:
              if not isinstance(row, dict):
                  continue
              code = str(row.get('id', '')).upper()
              name = str(row.get('name', '')).strip()
              count = row.get('count', 0)
              if re.fullmatch(r'[A-Z]{2}', code) and name and isinstance(count, (int, float)):
                  countries.append({'code': code, 'name': name, 'count': int(count)})

          countries.sort(key=lambda item: item['count'], reverse=True)
          if not countries:
              sample_ids = [str(row.get('id', '')) for row in location_data['stats'][:10] if isinstance(row, dict)]
              raise SystemExit('No ISO alpha-2 country entries found. Sample location IDs: ' + ', '.join(sample_ids))
          output = {
              'source': 'GoatCounter',
              'period': 'All time (from 2005-01-01)',
              'countries': countries[:7],
              'updated': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          }

          os.makedirs('assets/analytics', exist_ok=True)
          with open('assets/analytics/countries.json', 'w', encoding='utf-8') as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print('Country entries written:', len(output['countries']))
          print('Top country codes:', ', '.join(item['code'] for item in output['countries']))
          PY

      - name: Commit refreshed country summary
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/analytics/countries.json; then
            echo "No country-summary changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics/countries.json
          git commit -m "Update portfolio visitor country summary"
          git push
